# ==========================================
# REDIS EXPORTER
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        args:
        - '--redis.addr=redis:6379'
        ports:
        - containerPort: 9121


---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: monitoring
spec:
  ports:
  - port: 9121
    targetPort: 9121
  selector:
    app: redis-exporter
