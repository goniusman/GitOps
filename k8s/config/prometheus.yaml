apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'nestjs-microservices'
        static_configs:
          - targets: ['gateway.bookverse.svc.cluster.local:3000']





  