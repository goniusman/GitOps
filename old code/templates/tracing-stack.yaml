apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telemetry-jaeger
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://jaegertracing.github.io/helm-charts'
    chart: jaeger
    targetRevision: 3.3.3
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true