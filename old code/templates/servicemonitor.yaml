{{- range $name, $config := .Values.services }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bookverse-{{ $name }}-monitor
  labels:
    release: telemetry-prometheus  # Must match your Argo CD Prometheus release name
spec:
  selector:
    matchLabels:
      app: {{ $name }}            # Matches your specific service label (e.g., app: order)
  endpoints:
    - port: metrics               # Scrapes the named target port
      interval: 10s
      path: /metrics
{{- end }}