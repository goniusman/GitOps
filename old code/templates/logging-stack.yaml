apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telemetry-loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: loki-stack
    targetRevision: 2.10.2
    helm:
      parameters:
        - name: loki.persistence.enabled
          value: "false" # Keep Minikube lightweight
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true