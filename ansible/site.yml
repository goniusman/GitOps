---
# site.yml

# Step 1: Install Kubernetes Components across all Master and Worker nodes
- name: Provision Multi-Node Kubernetes Infrastructure
  hosts: kubernetes
  become: yes
  roles:
    - aws_k8s_cluster

# Step 2: Run GitOps Bootstrapping exactly once on the Master node control plane
- name: Launch Cloud-Native GitOps Control Engine
  hosts: kubernetes_master
  become: yes
  roles:
    - bootstrap_gitops

    