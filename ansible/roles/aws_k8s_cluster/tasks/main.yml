---
# roles/aws_k8s_cluster/tasks/main.yml

- name: System maintenance - Update apt package cache
  apt:
    update_cache: yes
    force_apt_get: yes

- name: Core Dependencies - Install required packages
  apt:
    name: [curl, python3-pip, python3-yaml]
    state: present

# --- MASTER CONFIGURATION ---
- name: Init K3s Control Plane (Run on Master Node Only)
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - \
    --write-kubeconfig-mode 644 \
    --disable servicelb \
    --disable traefik
  args:
    creates: /usr/local/bin/k3s
  when: "'kubernetes_master' in group_names"

- name: Read Cluster Secret Token from Master Node
  command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  changed_when: false
  when: "'kubernetes_master' in group_names"

- name: Distribute Master Token to Global Ansible Memory
  set_fact:
    master_node_token: "{{ hostvars['k8s_master']['k3s_token']['stdout'] }}"
  run_once: true

# --- WORKER CONFIGURATION ---
- name: Join Worker Nodes to Control Plane (Run on Worker Nodes Only)
  shell: |
    curl -sfL https://get.k3s.io | K3S_URL="https://{{ hostvars['k8s_master']['ansible_host'] }}:6443" \
    K3S_TOKEN="{{ master_node_token }}" \
    INSTALL_K3S_VERSION="{{ k3s_version }}" sh -
  args:
    creates: /usr/local/bin/k3s-agent
  when: "'kubernetes_workers' in group_names"