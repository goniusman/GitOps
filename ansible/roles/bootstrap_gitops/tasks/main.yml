---
# roles/bootstrap_gitops/tasks/main.yml

- name: Establish Required Core Platform Namespaces
  kubernetes.core.k8s:
    name: "{{ item }}"
    kind: Namespace
    state: present
  loop:
    - argocd
    - bookverse-data
    - bookverse-apps
    - monitoring

# --- STEP 4A: PROVISION SECURE BACKING DATABASES ---
- name: Add official Bitnami Helm Repository Asset Pipeline
  kubernetes.core.helm_repository:
    name: bitnami
    repo_url: "https://charts.bitnami.com/bitnami"

- name: Provision High-Availability PostgreSQL Database Matrix
  kubernetes.core.helm:
    name: bookverse-db
    chart_ref: bitnami/postgresql
    release_namespace: bookverse-data
    create_namespace: true
    values:
      auth:
        postgresPassword: "{{ db_password }}"
      architecture: "replication" # Production Ready Primary-Replica Topology

# --- STEP 4B: PROVISION ENTERPRISE ASYNC MESSAGE BROKER ---
- name: Provision RabbitMQ Cluster for Inter-service Microservice Communication
  kubernetes.core.helm:
    name: bookverse-mq
    chart_ref: bitnami/rabbitmq
    release_namespace: bookverse-data
    values:
      auth:
        password: "{{ rabbitmq_password }}"
      replicaCount: 3 # High availability clustered state

# --- STEP 4C: MONITORING PIPELINE & SERVICE MESH PLATFORM ---
- name: Add official Prometheus Community Chart Catalog
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: "https://kubernetes-charts.storage.googleapis.com"

- name: Spin up Prometheus, Grafana Operator Dashboard Engine
  kubernetes.core.helm:
    name: monitor-engine
    chart_ref: prometheus-community/kube-prometheus-stack
    chart_version: "{{ kube_prometheus_stack_version }}"
    release_namespace: monitoring

# --- STEP 4D: GITOPS CONTROLLER BOOTSTRAPPING ---
- name: Register Argo Project Repository Vector
  kubernetes.core.helm_repository:
    name: argo
    repo_url: "https://argoproj.github.io/argo-helm"

- name: Deploy Self-Managed ArgoCD Core Engine
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: argocd

# --- STEP 4E: THE GITOPS ROOT "APPLICATION OF APPLICATIONS" LINK ---
# This links ArgoCD directly to your GitHub Repository containing your 7 Helm charts
- name: Inject Master GitOps root pointer linking ArgoCD to GitHub Manifest State
  kubernetes.core.k8s:
    state: present
    namespace: argocd
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: bookverse-root-pipeline
        namespace: argocd
      spec:
        project: default
        source:
          repoURL: "{{ github_org_repo }}"
          targetRevision: "{{ gitops_repo_branch }}"
          path: apps/ # Pointing to the folder where your 7 microservices configs live
        destination:
          server: https://kubernetes.default.svc
          namespace: bookverse-apps
        syncPolicy:
          automated:
            prune: true
            selfHeal: true

# --- Inside roles/bootstrap_gitops/tasks/main.yml ---
- name: Provision High-Availability PostgreSQL Database Matrix
  kubernetes.core.helm:
    name: bookverse-db
    chart_ref: bitnami/postgresql
    release_namespace: bookverse-data
    values:
      auth:
        postgresPassword: "{{ db_password }}"
      architecture: "{{ postgresql_architecture }}" # Dynamically handles standalone vs replication

- name: Provision RabbitMQ Cluster for Inter-service Microservice Communication
  kubernetes.core.helm:
    name: bookverse-mq
    chart_ref: bitnami/rabbitmq
    release_namespace: bookverse-data
    values:
      auth:
        password: "{{ rabbitmq_password }}"
      replicaCount: "{{ rabbitmq_replica_count }}" # Dynamically scales nodes from 1 to 3








