# Public Facing Identity Endpoints
location /auth/ {
    proxy_pass http://auth_cluster;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Hidden Internal Loop for Forward Authentication Verification
location = /_auth_validation_gate {
    internal;
    proxy_pass http://auth_cluster/auth/validate-gateway;
    
    # Save egress payload performance costs
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    
    # Forward incoming client credential headers
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Request-ID $request_id;
}