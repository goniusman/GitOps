# =====================================================================
# METRICS & GRAFANA CONFIG
# =====================================================================
kube-prometheus-stack:
  alertmanager:
    enabled: false # Saves a ton of RAM

  prometheus:
    prometheusSpec:
      # Only target monitors in the 'bookverse' namespace
      serviceMonitorNamespaceSelector:
        matchNames:
          - bookverse
      podMonitorNamespaceSelector:
        matchNames:
          - bookverse
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      retention: 6h # Low retention prevents disk bloating
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      scrapeInterval: 30s
      evaluationInterval: 30s

  # FIXED: Grafana must be nested here so the parent chart configures it
  grafana:
    enabled: true 
    adminPassword: admin123
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
    service:
      type: ClusterIP

    additionalDataSources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://observability-kube-prometheus-prometheus:9090
        jsonData:
          httpMethod: POST

      - name: Loki
        type: loki
        access: proxy
        url: http://observability-loki:3100
        jsonData:
          maxLines: 1000

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://observability-jaeger-query:16686

  # Disable cluster-wide metric scrapers to preserve CPU/RAM
  kube-state-metrics:
    enabled: false

  nodeExporter:
    enabled: false

# =====================================================================
# LOGS STORAGE (Loki)
# =====================================================================
loki:
  # FIXED: Correctly nested deploymentMode
  deploymentMode: SingleBinary
  auth_enabled: false

  commonConfig:
    replication_factor: 1
  singleBinary:
    replicas: 1
  storage:
    type: filesystem
  limits_config:
    retention_period: 6h
    ingestion_rate_mb: 2
    ingestion_burst_size_mb: 4

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

# =====================================================================
# LOGS SHIPPER (Promtail)
# =====================================================================
promtail:
  config:
    clients:
      - url: http://observability-loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod

        relabel_configs:
          # Keep only running pods
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep

          # Set service name from labels
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app

          # Keep only the bookverse namespace logs
          - source_labels: [__meta_kubernetes_namespace]
            regex: bookverse
            action: keep

          # Filter for your specific microservices
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: order|auth|book|notification|user|review
            action: keep

          # FIXED: Promtail requires this specific rule to locate where 
          # the container log file actually sits on the minikube node.
          - action: replace
            source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log

        pipeline_stages:
          - cri: {}

# =====================================================================
# TRACING CONFIG (Jaeger)
# =====================================================================
jaeger:
  allInOne:
    enabled: true # FIXED: Must be true to use memory storage strategy
  storage:
    type: memory