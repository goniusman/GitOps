apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: observability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: observability
    spec:
      containers:
        # --- Grafana Core Application ---
        - name: grafana
          image: grafana/grafana:11.2.0
          # Moved environment variables to the correct container here:
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin123" # 👈 Change this to your desired password
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: sc-dashboard-volume
              mountPath: /tmp/dashboards

        # --- Kiwigrid Sidecar to dynamically read Dashboard ConfigMaps ---
        - name: grafana-sc-dashboard
          image: kiwigrid/k8s-sidecar:1.26.0
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: LABEL
              value: "grafana_dashboard"
            - name: FOLDER
              value: /tmp/dashboards
            - name: RESOURCE
              value: configmap
          volumeMounts:
            - name: sc-dashboard-volume
              mountPath: /tmp/dashboards

      # --- Shared Local Cache Directory ---
      volumes:
        - name: sc-dashboard-volume
          emptyDir: {}