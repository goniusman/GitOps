# ==========================================
# PROMTAIL
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: observability
spec:
  selector:
    matchLabels:
      app: promtail

  template:
    metadata:
      labels:
        app: promtail

    spec:
      serviceAccountName: promtail
      automountServiceAccountToken: true
      containers:
      - name: promtail
        image: grafana/promtail:2.9.0

        args:
        - -config.file=/etc/promtail/promtail.yaml

        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

        volumeMounts:
        - name: config
          mountPath: /etc/promtail

        - name: varlog
          mountPath: /var/log
          readOnly: true

        - name: dockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true

      volumes:
      - name: config
        configMap:
          name: promtail-config

      - name: varlog
        hostPath:
          path: /var/log

      - name: dockercontainers
        hostPath:
          path: /var/lib/docker/containers

---
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: observability
spec:
  ports:
  - port: 9080
    targetPort: 9080
  selector:
    app: promtail


---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: observability
automountServiceAccountToken: true


---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - namespaces
    verbs:
      - get
      - list
      - watch


---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: observability



