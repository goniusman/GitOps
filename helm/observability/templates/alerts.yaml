apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: error-alerts
  namespace: observability
spec:
  groups:
    - name: alerts
      rules:

      - alert: HighErrorRate
        expr: job:http_requests:error_rate > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"