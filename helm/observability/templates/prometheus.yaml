---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # CRITICAL: Attach the ServiceAccount providing cross-namespace visibility
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.retention.time=7d'
        - '--storage.tsdb.retention.size=2GB'
        ports:
        - containerPort: 9090
        env:
        - name: ACTIVE_APP
          value: "production"
        
        # FIXED: Indentation realigned perfectly
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
            
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 30

        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 30
          
        volumeMounts:
        - name: prometheus-storage
          mountPath: /prometheus
        - name: config-volume
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
      volumes:
      - name: prometheus-storage
        emptyDir: {}
      - name: config-volume
        configMap:
          name: prometheus-config


---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  ports:
  - port: 9090
    targetPort: 9090
  selector:
    app: prometheus


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'nestjs-microservices'
        metrics_path: /metrics

        static_configs:
          - targets:
              - gateway.bookverse.svc.cluster.local
              - auth.bookverse.svc.cluster.local
              - book.bookverse.svc.cluster.local
              - order.bookverse.svc.cluster.local
              - user.bookverse.svc.cluster.local
              - review.bookverse.svc.cluster.local
              - notification.bookverse.svc.cluster.local


