apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  gateway.json: |
    {
      "title": "Gateway Metrics",
      "panels": [
        {
          "type": "graph",
          "title": "HTTP Requests",
          "targets": [
            {
              "expr": "rate(http_requests_total[5m])"
            }
          ]
        }
      ]
    }