apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    chart: istiod
    targetRevision: 1.22.1
    helm:
      values: |
        global:
          meshID: mesh1
          multiCluster:
            clusterName: minikube-cluster

        # 1. Correct placement for Istiod Control Plane resource limits
        resources:
          requests:
            cpu: "100m"   
          # 2. Downsized default proxy footprint for injected pods
          defaultConfig:
            proxyMetadata: {}
            resources:
              requests:
                cpu: "10m"      # Tiny CPU footprint for sidecars
                memory: "64Mi"  # Drops sidecar memory requirements significantly
              limits:
                cpu: "200m"
                memory: "128Mi"
            memory: "256Mi"     # Dropped from 512Mi to save space locally
          limits:
            cpu: "500m"      
            memory: "512Mi"

        meshConfig:
          accessLogFile: /dev/stdout
          enableAutoMtls: true
          
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true