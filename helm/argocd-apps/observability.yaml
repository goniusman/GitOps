apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd   # The namespace where your Argo CD instance is running
spec:
  project: default
  source:
    # 1. Point this to your Git repository holding the code
    repoURL: 'https://github.com/goniusman/GitOps'
    targetRevision: dev
    
    # 2. Point this to the exact folder path where your Chart.yaml lives
    path: ./helm/observability  # Adjust this path based on your repo structure  

    # 3. Tell Argo CD to automatically build dependencies (Chart.yaml)
    helm:
      valueFiles:
        - values.yaml
  
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability  # The target namespace for your stack
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Fixes the original error by auto-creating the 'observability' namespace
      - CreateNamespace=true