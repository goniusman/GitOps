apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    # 1. Point ArgoCD to your GitOps repository
    repoURL: 'https://github.com/goniusman/GitOps.git'
    targetRevision: dev
    # 2. Tell it which official Helm chart to pull down
    chart: kube-prometheus-stack
    # 3. Reference the Helm repository details for the engine
    helm:
      valueFiles:
        - helm/monitoring/prometheus-values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
