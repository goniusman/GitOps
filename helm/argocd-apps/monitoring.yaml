apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  # Tell ArgoCD to send the compiled resources into 'monitoring'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  # Use 'sources' (plural) to combine Helm registry with your Git values
  sources:
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: kube-prometheus-stack
      targetRevision: 61.3.0
      helm:
        valueFiles:
          # $dev-repo points to the root of the Git source defined below
          - $dev-repo/helm/monitoring/prometheus-values.yaml
    - repoURL: 'https://github.com/goniusman/GitOps.git'
      targetRevision: dev
      ref: dev-repo # This matches the $dev-repo prefix above
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
# Update ONLY the loki-stack portion in your argocd/infra-apps.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  sources:
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: loki
      targetRevision: 6.6.0
      helm:
        valueFiles:
          - $dev-repo/helm/monitoring/loki-values.yaml
        # ADD THIS PARAMETERS BLOCK HERE:
        parameters:
          - name: loki.useTestSchema
            value: "true"
    - repoURL: 'https://github.com/goniusman/GitOps.git'
      targetRevision: dev
      ref: dev-repo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail-stack
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  sources:
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: promtail
      targetRevision: 6.16.0
    - repoURL: 'https://github.com/goniusman/GitOps.git'
      targetRevision: dev
      ref: dev-repo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/refresh: "hard"
    cache-buster: "v2"
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  sources:
    - repoURL: 'https://jaegertracing.github.io/helm-charts'
      chart: jaeger
      targetRevision: 3.3.0
      helm:
        valueFiles:
          # This maps your new custom values file onto the helm install execution
          - $dev-repo/helm/monitoring/jaeger-values.yaml
    - repoURL: 'https://github.com/goniusman/GitOps.git'
      targetRevision: dev
      ref: dev-repo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true