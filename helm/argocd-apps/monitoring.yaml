apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/goniusman/GitOps.git'
    targetRevision: dev
    chart: jaeger
    helm:
      valueFiles:
        - helm/monitoring/jaeger-values.yaml
    # Note: If you don't use a custom jaeger-values.yaml file, 
    # you can omit the helm block entirely and ArgoCD will use chart defaults.
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true