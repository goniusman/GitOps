apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    chart: gateway
    targetRevision: 1.22.1
    # 🌟 Added Helm values to clamp the Gateway down
    helm:
      values: |
        replicaCount: 1 # Dropped from 2 to save local cluster resources
        
        resources:
          requests:
            cpu: "50m"      # Tiny baseline footprint
            memory: "64Mi"
          limits:
            cpu: "300m"     # Keeps it from spiking your laptop's CPU
            memory: "128Mi"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipSchemaValidation=true