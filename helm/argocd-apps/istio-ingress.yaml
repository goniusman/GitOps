apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    chart: gateway
    targetRevision: 1.22.1
    helm:
      values: |
        # 🌟 Clean root-level properties accepted natively by the modern gateway chart
        service:
          type: NodePort
        
        # If you need custom labels on the pod/service, use the native 'topology' or 'labels' block if supported, 
        # but the chart automatically injects app=istio-ingressgateway by default.
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true