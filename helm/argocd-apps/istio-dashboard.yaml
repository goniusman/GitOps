# 5. NEW: Lightweight Trace & Dashboard Extensions (No heavy backend!)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/goniusman/GitOps.git
    targetRevision: master
    path: helm/argocd-apps/istio-addons # 🌟 Points to the flat, simple YAML folder we pulled earlier
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true