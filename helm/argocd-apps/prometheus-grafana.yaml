apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 61.3.1
    helm:
      values: |
        # 1. Global strip-down
        alertmanager:
          enabled: false # Turn off if you aren't testing alerts. Saves ~250MB RAM.

        prometheusOperator:
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi

        prometheus:
          prometheusSpec:
            scrapeInterval: "30s" # 🌟 Slow down scraping from 15s to 30s. Cuts CPU load exactly in half!
            evaluationInterval: "30s"
            podAntiAffinity: "soft"
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            
            # 2. Limit Prometheus resource hogging
            retention: 1d # Only keep 1 day of history instead of 14 days
            resources:
              limits:
                cpu: 500m
                memory: 1024Mi # Hard cap at 1GB RAM
              requests:
                cpu: 100m
                memory: 512Mi

            storageSpec:
              volumeClaimTemplate:
                spec:
                  # storageClassName: standard # Minikube's default storage class
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi # Dropped from 10Gi

        grafana:
          enabled: true
          # 3. Limit Grafana footprint
          resources:
            limits:
              cpu: 300m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 256Mi
          persistence:
            enabled: true
            # storageClassName: standard # Minikube's default storage class
            size: 1Gi # Dropped from 5Gi
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki-distributed-query-frontend.monitoring.svc.cluster.local:3100
              jsonData:
                maxLines: 1000

        # 4. Disable heavy default scrapers you likely don't need locally
        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false

        additionalServiceMonitors:
          - name: istio-mesh-monitor
            additionalLabels:
              release: kube-prometheus-stack
            endpoints:
              - port: http-monitoring
                interval: 15s
            namespaceSelector:
              matchNames:
                - istio-system
            selector:
              matchLabels:
                app: istiod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true