apiVersion: v1
kind: Service
metadata:
  name: book
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: book
    app.kubernetes.io/part-of: bookverse
    app.kubernetes.io/component: microservice
spec:
  ports:
    - name: http
      port: {{ .Values.book.service.port }}
      targetPort: {{ .Values.book.service.port }}
  selector:
    app: book