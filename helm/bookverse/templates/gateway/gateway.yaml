apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: global-local-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingress
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*" 
    # - "*.local" # Catches dashboard.local, argo.local, etc.