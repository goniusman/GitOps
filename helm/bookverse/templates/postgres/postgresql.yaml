# 1. PRIMARY WRITER SERVICE
apiVersion: v1
kind: Service
metadata:
  name: bookverse-postgresql-primary
  namespace: bookverse
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-primary


---
# 2. PRIMARY STATEFULSET
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: bookverse
spec:
  serviceName: bookverse-postgresql-primary
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: fix-permissions
          image: alpine:latest
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME_AUTH
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PASSWORD
          # FIX: Explicitly boots postgres and opens the pg_hba.conf file to allow streaming clones
          command:
            - "bash"
            - "-c"
            - |
              # ✅ FIXED: Changed unit syntax from 256M to 256MB
              /usr/local/bin/docker-entrypoint.sh postgres \
                -c wal_level=replica \
                -c max_wal_senders=10 \
                -c max_replication_slots=10 \
                -c wal_keep_size=256MB &
              
              # Wait until pg_hba.conf is generated by the entrypoint script
              until [ -f /var/lib/postgresql/data/pg_hba.conf ]; do sleep 1; done
              
              # Allow replication streaming connections from anywhere inside the local cluster
              echo "host replication all all trust" >> /var/lib/postgresql/data/pg_hba.conf
              
              # Reload configuration parameters safely
              pg_ctl reload
              
              # Keep container execution attached to the main log thread
              wait
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgresql-pvc

  # volumeClaimTemplates:
  #   - metadata: { name: pgdata }
  #     spec:
  #       accessModes: [ "ReadWriteOnce" ]
  #       resources: { requests: { storage: 1Gi } }


---
# 3. READ REPLICA SERVICE
apiVersion: v1
kind: Service
metadata:
  name: bookverse-postgresql-read
  namespace: bookverse
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-replica
  sessionAffinity: ClientIP


---
# 4. READ REPLICAS STATEFULSET
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: bookverse
spec:
  serviceName: bookverse-postgresql-read
  replicas: 2
  selector:
    matchLabels:
      app: postgres-replica
  template:
    metadata:
      labels:
        app: postgres-replica
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: fix-permissions
          image: alpine:latest
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME_AUTH
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PASSWORD
          # ADDED READINESS PROBE: Essential to prevent routing queries during clones
          # OPTIMIZED READINESS PROBE
          readinessProbe:
            exec:
              command:
                - "pg_isready"
                - "-h"
                - "127.0.0.1"        # Force connection via local network instead of Unix socket
                - "-U"
                - "bookverse"        # Hardcoded matching your app user
                - "-d"
                - "bookverse_auth"   # Hardcoded matching your target database
            initialDelaySeconds: 30  # Increased to give the pg_basebackup clone script time to run
            periodSeconds: 10        # Check every 10 seconds
            failureThreshold: 6      # Allow up to 1 minute of cloning time before marking as failed
          command:
            - "bash"
            - "-c"
            - |
              # FIX: Use the absolute FQDN targeting the pod directly with the user flag
              until pg_isready -h postgres-primary-0.bookverse-postgresql-primary.bookverse.svc.cluster.local -p 5432 -U "$POSTGRES_USER"; do
                echo "Waiting for Primary Database Pod (postgres-primary-0) to accept connections..."
                sleep 2
              done
              
              if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
                echo "Empty storage detected. Cloning database via pg_basebackup..."
                rm -rf /var/lib/postgresql/data/*
                pg_basebackup -h postgres-primary-0.bookverse-postgresql-primary.bookverse.svc.cluster.local -D /var/lib/postgresql/data -U "$POSTGRES_USER" -v -P -R
              fi
              echo "Starting replication node in hot standby mode..."
              exec postgres -c hot_standby=on -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgresql-pvc
  # volumeClaimTemplates:
  #   - metadata: { name: pgdata }
  #     spec:
  #       accessModes: [ "ReadWriteOnce" ]
  #       resources: { requests: { storage: 1Gi } }