{{- range .Values.applications }}
{{- if .enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .name }}"
  namespace: "{{ $.Values.global.namespace }}"
  labels:
    app.kubernetes.io/name: "{{ .name }}"
    app.kubernetes.io/part-of: "{{ $.Values.global.namespace }}"
    app.kubernetes.io/component: microservice
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      app: "{{ .name }}"
  template:
    metadata:
      annotations:
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
      labels:
        app: "{{ .name }}"
        app.kubernetes.io/name: "{{ .name }}"
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: "{{ $.Values.global.namespace }}"
    spec:
      containers:
        - name: "{{ .name }}"
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .service.port }}
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: "PORT"
              value: "{{ .service.port }}"
            - name: OTEL_SERVICE_NAME
              value: {{ .name | quote }}
              
          {{- if .rediness }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- end }}
          
          {{- if .liveness }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .service.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          {{- end }}
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
{{- end }}
{{- end }}

---

{{- range .Values.applications }}
{{- if .enabled }}

apiVersion: v1
kind: Service
metadata:
  name: "{{ .name }}"
  namespace: "{{ $.Values.global.namespace }}"
  labels:
    app.kubernetes.io/name: "{{ .name }}"
    app.kubernetes.io/part-of: "{{ $.Values.global.namespace }}"
    app.kubernetes.io/component: microservice
spec:
  selector:
    app.kubernetes.io/name: "{{ .name }}"
  ports:
    - name: http
      port: {{ .service.port }}
      targetPort: {{ .service.port }}

{{- end }}
{{- end }}











