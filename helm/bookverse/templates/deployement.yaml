{{- range .Values.applications }}
{{- if .enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name | quote }}
  namespace: {{ $.Values.global.namespace | quote }}
  labels:
    # 1. Istio Canonical Telemetry Labels (Fixes "version label missing")
    app: {{ .name | quote }}
    version: {{ $.Values.image.tag | default "v1" | quote }}

    # 2. Recommended Kubernetes Labels
    app.kubernetes.io/name: {{ .name | quote }}
    app.kubernetes.io/part-of: {{ $.Values.global.namespace | quote }}
    app.kubernetes.io/component: microservice
    app.kubernetes.io/version: {{ $.Values.image.tag | default "v1" | quote }}
spec:
  replicas: {{ .replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .name | quote }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .service.port | quote }}
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
      labels:
        # Istio Telemetry Labels (Pod Level)
        app: {{ .name | quote }}
        version: {{ $.Values.image.tag | default "v1" | quote }} # <--- ADDED HERE

        # Kubernetes Standard Labels
        app.kubernetes.io/name: {{ .name | quote }}
        app.kubernetes.io/version: {{ $.Values.image.tag | default "v1" | quote }}
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: {{ $.Values.global.namespace | quote }}
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: {{ .name | quote }}
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http-web
              containerPort: {{ .service.port }}
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: "PORT"
              value: {{ .service.port | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .name | quote }}

          {{- if .startupProbe }}
          startupProbe:
            httpGet:
              path: /health/live
              port: {{ .service.port }}
            failureThreshold: 30
            periodSeconds: 10
          {{- end }}

          {{- if .readiness }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- end }}
          
          {{- if .liveness }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .service.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          {{- end }}

          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name | quote }}
  namespace: {{ $.Values.global.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .name | quote }}
    app.kubernetes.io/part-of: {{ $.Values.global.namespace | quote }}
    app.kubernetes.io/component: microservice
spec:
  type: ClusterIP
  selector:
    app: {{ .name | quote }}
  ports:
    - name: http-web
      port: {{ .service.port }}
      targetPort: {{ .service.port }}
    {{- if .service.micro_port }}
    - name: tcp-{{ .name }}
      port: {{ .service.micro_port }}
      targetPort: {{ .service.micro_port }}
    {{- end }}  


---
apiVersion: networking.istio.io/v1beta1
# apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .name | quote }}
  namespace: {{ $.Values.global.namespace | quote }}
spec:
  hosts:
    - {{ .name | quote }}
  http:
    - timeout: 3s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream,5xx
      route:
        - destination:
            host: {{ .name | quote }}
            port:
              number: {{ .service.port }}

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ .name | quote }}
  namespace: {{ $.Values.global.namespace | quote }}
spec:
  host: {{ .name | quote }}
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 2m
      maxEjectionPercent: 100

---
{{- end }}
{{- end }}




---
### Global Security Policies (Defined once per namespace)
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: {{ $.Values.global.namespace | quote }}
spec:
  mtls:
    mode: PERMISSIVE
    # mode: STRICT


---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-bookverse
  namespace: {{ $.Values.global.namespace | quote }}
spec:
  action: ALLOW
  rules:
  - from:
      - source:
          namespaces:
            - {{ $.Values.global.namespace | quote }}
            - "istio-system"
  - to:
    - operation:
        ports: ["80", "8080", "3000", "5000", "5001", "5002", "5003", "5004", "5005", "5006", "5007", "5008", "5009"]


---


