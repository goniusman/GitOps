# ==========================================
# REDIS
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: bookverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2.4
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: redis-data
        emptyDir: {} # Replace with a PersistentVolumeClaim in production

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: bookverse
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis




