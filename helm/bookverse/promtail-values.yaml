# promtail-values.yaml

# 1. Point Promtail to your Loki installation
config:
  clients:
    - url: http://loki.istio-system.svc.cluster.local:3100/loki/api/v1/push

# 2. Configure multi-namespace namespace filtering
# This ensures Promtail targets both your Istio mesh infrastructure and your business app
configmap:
  content: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.istio-system.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: (bookverse|istio-system) # Scrapes only your app and istio namespaces
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      pipeline_stages:
      - docker: {}