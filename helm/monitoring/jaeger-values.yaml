# jaeger-values.yaml

# 1. Clear Cassandra/Elasticsearch using flat booleans (NOT nested maps)
provisionDataStore:
  cassandra: false
  elasticsearch: false
  kafka: false

# 2. Select memory mode at the ROOT level of the values file
storage:
  type: memory

# 3. Activate All-In-One and assign resource constraints directly inside it
allInOne:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# 4. Disable separate microservice pods since All-In-One handles them natively
agent:
  enabled: false
collector:
  enabled: false
query:
  enabled: false