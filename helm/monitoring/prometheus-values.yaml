#     kubeProxy: false
#     kubePrometheusNodeAlerting: false
#     kubePrometheusGeneralAlerting: false
#     kubeScheduler: false
#     kubeStateMetrics: false
#     network: false
#     node: false
#     prometheus: false
#     prometheusOperator: false
#     time: false

nodeExporter:
  enabled: false

# 🚫 DISABLES ALERTMANAGER (Saves a whole extra pod)
alertmanager:
  enabled: false

prometheusOperator:
  # admissionWebhooks:
  #   enabled: false
  #   patch:
  #     enabled: false
  crds:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  additionalDataSources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://monitoring-stack-kube-prom-prometheus:9090
      isDefault: true
      
    - name: Alertmanager
      type: alertmanager
      access: proxy
      url: http://monitoring-stack-alertmanager:9093
      isDefault: false
      jsonData:
        implementation: prometheus

    - name: Loki
      type: loki
      access: proxy
      url: http://loki-stack:3100
      version: 1
      isDefault: false
      jsonData:
        derivedFields:
          - datasourceUid: jaeger
            matcherRegex: "traceID=(\\w+)"
            name: TraceID
            url: "$${__value.raw}"

    - name: Jaeger
      type: jaeger
      uid: jaeger
      access: proxy
      url: http://jaeger-stack-query:16686
      version: 1
      isDefault: false


# helm upgrade prometheus prometheus-community/kube-prometheus-stack \
#   -f prometheus-values.yaml \
#   -n monitoring \
#   --skip-crds






