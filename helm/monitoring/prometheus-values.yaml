# helm/monitoring/prometheus-values.yaml

prometheus:
  prometheusSpec:
    replicas: 1
    # 💾 SAVES DISK SPACE: Drop data retention from 2 days to 6 hours
    retention: 6h
    retentionSize: "1GB"
    
    # ⚡ SAVES CPU: Reduce resource limits so it can't hijack your machine
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    
    additionalScrapeConfigs:
      - job_name: 'kubernetes-pods-autodiscover'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

# 🚫 DISABLES HIGH-CPU CLUSTER METRICS (We only care about your NestJS app)
kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false

# 🚫 DISABLES ALERTMANAGER (Saves a whole extra pod)
alertmanager:
  enabled: false

prometheusOperator:
  crds:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-single-binary.monitoring.svc.cluster.local:3100
      version: 1
      isDefault: false
      jsonData:
        derivedFields:
          - datasourceUid: jaeger
            matcherRegex: "traceID=(\\w+)"
            name: TraceID
            url: "$${__value.raw}"
    - name: Jaeger
      type: jaeger
      uid: jaeger
      access: proxy
      url: http://jaeger.monitoring.svc.cluster.local:16686
      version: 1
      isDefault: false


# helm upgrade prometheus prometheus-community/kube-prometheus-stack \
#   -f prometheus-values.yaml \
#   -n monitoring \
#   --skip-crds






