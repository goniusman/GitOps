# helm/monitoring/prometheus-values.yaml
# Bypass strict TLS verification for Minikube's internal system components
kubelet:
  enabled: true
  serviceMonitor:
    https: true
    # 🔓 THE FIX: Tell Prometheus to accept Minikube's self-signed certificates
    tlsConfig:
      insecureSkipVerify: true

prometheus:
  prometheusSpec:
    replicas: 1
    # 💾 SAVES DISK SPACE: Drop data retention from 2 days to 6 hours
    retention: 6h
    retentionSize: "1GB"
    # 🛑 THE FIX: Tell Prometheus to stop searching for Alertmanager configs
    alerting:
      alertmanagers: []
    # Also ignore strict TLS for any additional runtime discovery targets
    tlsConfig:
      insecureSkipVerify: true
    # ⚡ SAVES CPU: Reduce resource limits so it can't hijack your machine
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
    - job_name: kubernetes-pods-autodiscover

      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - bookverse

      relabel_configs:
        # Only scrape annotated pods
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true

        # 2. TARGET ONLY THE BOOKVERSE NAMESPACE 
        - source_labels: [__meta_kubernetes_namespace]
          action: keep
          regex: bookverse

        # Metrics path
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)

        # Metrics port
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__

        # Namespace
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace

        # Pod Name
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod

        # Node Name
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node

        # Service/Application Name
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          target_label: service

        # Fallback if app.kubernetes.io/name is not present
        - source_labels: [__meta_kubernetes_pod_label_app]
          target_label: service

        # Component
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          target_label: component

        # Version
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
          target_label: version

        # Part Of
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
          target_label: application

        # Container
        - source_labels: [__meta_kubernetes_pod_container_name]
          target_label: container

# 🚫 DISABLES HIGH-CPU CLUSTER METRICS (We only care about your NestJS app)
kubeStateMetrics:
  enabled: false

# 🚫 DISABLE DEFAULT CORE ALERTS (Saves CPU & prevents Operator generation lock)
# defaultRules:
#   create: false
#   rules:
#     alertmanager: false
#     etcd: false
#     configReloaders: false
#     k8s: false
#     kubeApiserver: false
#     kubeApiserverAvailability: false
#     kubeApiserverSlos: false
#     kubeLet: false
#     kubeProxy: false
#     kubePrometheusNodeAlerting: false
#     kubePrometheusGeneralAlerting: false
#     kubeScheduler: false
#     kubeStateMetrics: false
#     network: false
#     node: false
#     prometheus: false
#     prometheusOperator: false
#     time: false

nodeExporter:
  enabled: true

# 🚫 DISABLES ALERTMANAGER (Saves a whole extra pod)
alertmanager:
  enabled: true

prometheusOperator:
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true
  crds:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

grafana:
  enabled: true
  grafana.ini:
    feature_toggles:
      enable: "appObservability,exploreMixedDatasource" # 🌟 Forces the logs/traces menus on
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  additionalDataSources:
    # - name: Prometheus
    #   type: prometheus
    #   access: proxy
    #   url: http://monitoring-stack-kube-prom-prometheus:9090
    #   isDefault: true
      
    - name: Alertmanager
      type: alertmanager
      access: proxy
      url: http://monitoring-stack-alertmanager:9093
      isDefault: false
      jsonData:
        implementation: prometheus

    - name: Loki
      type: loki
      access: proxy
      url: http://loki-stack:3100
      version: 1
      isDefault: false
      jsonData:
        derivedFields:
          - datasourceUid: jaeger
            matcherRegex: "traceID=(\\w+)"
            name: TraceID
            url: "$${__value.raw}"

    - name: Jaeger
      type: jaeger
      uid: jaeger
      access: proxy
      url: http://jaeger-stack-query:16686
      version: 1
      isDefault: false


# helm upgrade prometheus prometheus-community/kube-prometheus-stack \
#   -f prometheus-values.yaml \
#   -n monitoring \
#   --skip-crds






