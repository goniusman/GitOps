# helm/monitoring/prometheus-values.yaml
# Bypass strict TLS verification for Minikube's internal system components
kubelet:
  enabled: true
  serviceMonitor:
    https: true
    # 🔓 THE FIX: Tell Prometheus to accept Minikube's self-signed certificates
    tlsConfig:
      insecureSkipVerify: true

prometheus:
  prometheusSpec:
    replicas: 1
    # 💾 SAVES DISK SPACE: Drop data retention from 2 days to 6 hours
    retention: 6h
    retentionSize: "1GB"
    # 🛑 THE FIX: Tell Prometheus to stop searching for Alertmanager configs
    alerting:
      alertmanagers: []
    # Also ignore strict TLS for any additional runtime discovery targets
    tlsConfig:
      insecureSkipVerify: true
    # ⚡ SAVES CPU: Reduce resource limits so it can't hijack your machine
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    
    additionalScrapeConfigs:
      - job_name: 'kubernetes-pods-autodiscover'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

# 🚫 DISABLES HIGH-CPU CLUSTER METRICS (We only care about your NestJS app)
kubeStateMetrics:
  enabled: false

# 🚫 DISABLE DEFAULT CORE ALERTS (Saves CPU & prevents Operator generation lock)
# defaultRules:
